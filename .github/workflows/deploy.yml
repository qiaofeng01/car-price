name: update-and-deploy

on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:
    inputs:
      demo:
        description: '用示例数据（不抓取，用于验证发布链路）'
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: 抓取并生成 JSON
        run: |
          if [ "${{ inputs.demo }}" = "true" ]; then
            python scripts/fetch.py --out site/data --demo --verbose
          else
            python scripts/fetch.py --out site/data --verbose
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
